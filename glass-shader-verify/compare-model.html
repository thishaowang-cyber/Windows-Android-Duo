<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>对比：两种透视模型</title>
<style>
  html, body { margin: 0; background: #14161c; color: #dfe3ea;
               font: 13px/1.5 ui-monospace, Consolas, monospace; }
  canvas { border: 1px solid #333; background: #000; display: block; }
  #status { padding: 8px 12px; }
</style>
</head>
<body>
<div id="status">渲染中…</div>
<canvas id="out" width="1080" height="2610"></canvas>
<script type="module">
window.addEventListener('error', (e) => {
  const el = document.getElementById('status');
  if (el) el.textContent = 'ERR: ' + (e.message || e.error);
});
window.addEventListener('unhandledrejection', (e) => {
  const el = document.getElementById('status');
  if (el) el.textContent = 'REJ: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
});
// Compares the reference projection (hinge compression, near-hinge magnified)
// with a uniform recede: the content shrinks proportionally, so black bands
// appear on the sides and the far edge instead of stretching.
const W = 360, H = 800;
const ANGLES = [40, 70];
const CROP = W / H;                 // source is pre-cropped to the display aspect

const glc = document.createElement('canvas');
glc.width = W; glc.height = H;
const gl = glc.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
if (!gl) throw new Error('no webgl2');

function makeSource(aspect) {
  const sw = 450, sh = Math.round(sw / aspect);
  const c = document.createElement('canvas');
  c.width = sw; c.height = sh;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, sw, sh);
  grad.addColorStop(0, '#1d3f7a'); grad.addColorStop(0.5, '#3a2260'); grad.addColorStop(1, '#0f4a48');
  g.fillStyle = grad; g.fillRect(0, 0, sw, sh);
  const s = Math.min(sw, sh);
  g.strokeStyle = 'rgba(255,255,255,0.6)'; g.lineWidth = Math.max(1, s * 0.006);
  for (let i = 1; i < 12; i++) { const y = sh * i / 12; g.beginPath(); g.moveTo(0, y); g.lineTo(sw, y); g.stroke(); }
  for (let i = 1; i < 5; i++) { const x = sw * i / 5; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, sh); g.stroke(); }
  const band = (top, label, fill) => {
    const ph = sh * 0.06;
    g.fillStyle = fill; g.fillRect(0, top ? 0 : sh - ph, sw, ph);
    g.fillStyle = '#000'; g.font = `bold ${Math.round(s * 0.07)}px monospace`;
    g.fillText(label, sw * 0.04, (top ? 0 : sh - ph) + ph * 0.78);
  };
  band(true, 'TOP', '#ff4d4d');
  band(false, 'BTM', '#ffd24d');
  g.strokeStyle = '#fff'; g.lineWidth = Math.max(2, s * 0.012);
  g.beginPath(); g.moveTo(sw / 2, sh * 0.42); g.lineTo(sw / 2, sh * 0.58); g.stroke();
  g.beginPath(); g.moveTo(sw * 0.35, sh / 2); g.lineTo(sw * 0.65, sh / 2); g.stroke();
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = `bold ${Math.round(s * 0.1)}px sans-serif`;
  g.fillText('GLASS', sw / 2, sh * 0.4);
  return g.getImageData(0, 0, sw, sh);
}

async function loadShader(n) {
  const r = await fetch('./shaders/' + n, { cache: 'no-store' });
  if (!r.ok) throw new Error(n + ' ' + r.status);
  return r.text();
}
function compile(t, src) {
  const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function link(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

const VAO = gl.createVertexArray();

// --- the reference model (fetched, unchanged)
const VERT = await loadShader('glass.vert');
const refProg = link(VERT, await loadShader('glass.frag'));
const refU = {};
for (const n of ['uSize','uAngle','uFrost','uEye','uAspect','uTex','uFlip','uHingeTop'])
  refU[n] = gl.getUniformLocation(refProg, n);

// --- uniform recede: content shrinks by a single scale about an anchor
const RECEDE_FRAG = `#version 300 es
precision highp float;
uniform vec2 uSize;
uniform float uAngle;
uniform float uK;
uniform vec2 uAnchor;
uniform sampler2D uTex;
out vec4 fragColor;
const vec3 BG = vec3(0.015, 0.018, 0.025);
void main() {
    vec2 pixel = vec2(gl_FragCoord.x, uSize.y - gl_FragCoord.y);  // y from the top
    float A = 1.0 + uK * sin(radians(uAngle));
    vec2 uv = (pixel / uSize - uAnchor) * A + uAnchor;
    if (any(lessThan(uv, vec2(0.0))) || any(greaterThan(uv, vec2(1.0)))) {
        fragColor = vec4(BG, 1.0);
        return;
    }
    fragColor = vec4(texture(uTex, uv).rgb, 1.0);
}`;
const recProg = link(VERT, RECEDE_FRAG);
const recU = {};
for (const n of ['uSize','uAngle','uK','uAnchor','uTex'])
  recU[n] = gl.getUniformLocation(recProg, n);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
const src = makeSource(CROP);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
gl.generateMipmap(gl.TEXTURE_2D);

function begin() {
  gl.viewport(0, 0, W, H);
  gl.bindVertexArray(VAO);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
}
function drawRef(angle) {
  begin();
  gl.useProgram(refProg);
  gl.uniform1i(refU.uTex, 0);
  gl.uniform2f(refU.uSize, W, H);
  gl.uniform1f(refU.uAngle, angle);
  gl.uniform1f(refU.uFrost, 0.0);
  gl.uniform1f(refU.uEye, 2.4);
  gl.uniform1f(refU.uAspect, CROP);
  gl.uniform1f(refU.uFlip, 0);
  gl.uniform1f(refU.uHingeTop, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function drawRecede(angle, anchor, k) {
  begin();
  gl.useProgram(recProg);
  gl.uniform1i(recU.uTex, 0);
  gl.uniform2f(recU.uSize, W, H);
  gl.uniform1f(recU.uAngle, angle);
  gl.uniform1f(recU.uK, k);
  gl.uniform2f(recU.uAnchor, anchor[0], anchor[1]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

const out = document.getElementById('out');
const ctx = out.getContext('2d');
ctx.fillStyle = '#0b0c10'; ctx.fillRect(0, 0, out.width, out.height);

const rows = [
  { title: '当前模型（铰链压缩，近铰链侧放大）', kind: 'ref' },
  { title: '方案 A：等比后退，锚在铰链边（下/左/右有黑边，不拉伸）', kind: 'rec', anchor: [0.5, 1.0], k: 0.75 },
  { title: '方案 B：等比后退，锚在中心（四边都有黑边）', kind: 'rec', anchor: [0.5, 0.5], k: 0.45 },
];

const ROW_H = 870;
rows.forEach((row, r) => {
  ctx.fillStyle = '#dfe3ea'; ctx.font = 'bold 19px ui-monospace, monospace';
  ctx.fillText(row.title, 10, r * ROW_H + 26);
  ANGLES.forEach((angle, c) => {
    if (row.kind === 'ref') drawRef(angle); else drawRecede(angle, row.anchor, row.k);
    ctx.drawImage(glc, c * W, r * ROW_H + 40, W, H);
    ctx.fillStyle = '#8b93a7'; ctx.font = '17px ui-monospace, monospace';
    ctx.fillText(`倾角 ${angle}°`, c * W + 10, r * ROW_H + 62);
  });
});
document.getElementById('status').textContent = '上=当前，中=方案A(锚铰链边)，下=方案B(锚中心)';

window.__save = async (name = 'model-compare.png') => {
  const blob = await new Promise((r) => out.toBlob(r, 'image/png'));
  const res = await fetch('/save/' + name, { method: 'POST', body: blob });
  return await res.text();
};
window.__ready = true;
</script>
</body>
</html>
